name: Publicar aplicación de Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Compilar y publicar
    runs-on: windows-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Comprobar la versión
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}".TrimStart("v")
          if ($packageVersion -ne $tagVersion) {
            throw "La etiqueta ${{ github.ref_name }} no coincide con la versión $packageVersion de package.json"
          }

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el instalador
        run: npm run desktop:build

      - name: Publicar todos los archivos en una sola release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $releaseTitle = $tag.TrimStart("v")
          $assets = @(
            "release/Programa-VMC-Setup.exe",
            "release/Programa-VMC-Setup.exe.blockmap",
            "release/latest.yml"
          )

          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            gh release create $tag $assets `
              --verify-tag `
              --title $releaseTitle `
              --generate-notes `
              --latest `
              --repo $env:GITHUB_REPOSITORY
          }
